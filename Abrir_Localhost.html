<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=http://localhost:3000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP Consultoria - Acessar Localhost</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9ff;
            color: #0b1c30;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 36px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 12px 0;
        }
        p {
            color: #4a5568;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #006c49;
            color: #ffffff;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #005236;
        }
    </style>
    <script>
        window.location.replace("http://localhost:3000");
    </script>
</head>
<body>
    <div class="card">
        <div class="icon">🏛️</div>
        <h1>MP Consultoria</h1>
        <p>Redirecionando para o servidor local (<strong>http://localhost:3000</strong>)...</p>
        <a class="btn" href="http://localhost:3000">Acessar http://localhost:3000</a>
    </div>
</body>
</html>
