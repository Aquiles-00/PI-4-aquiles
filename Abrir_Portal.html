<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP Consultoria - Abrir Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9ff;
            color: #0b1c30;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #002b49;
        }
        p {
            color: #4a5568;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #006c49;
            color: #ffffff;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 108, 73, 0.2);
        }
        .btn:hover {
            background: #005236;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #e6f4ea;
            color: #006c49;
            box-shadow: none;
            border: 1px solid #b7dfca;
        }
        .btn-secondary:hover {
            background: #d4edd9;
            color: #005236;
        }
        .footer-note {
            font-size: 12px;
            color: #718096;
            margin-top: 20px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🏛️</div>
        <h1>MP Consultoria</h1>
        <p>Escolha como deseja acessar o Portal de Serviços Financeiros:</p>
        
        <div class="btn-group">
            <a class="btn" href="http://localhost:3000">
                🌐 Acessar via Servidor Local (http://localhost:3000)
            </a>
            <a class="btn btn-secondary" href="src/public/index.html">
                📁 Abrir Arquivo HTML Direto (Modo Offline)
            </a>
        </div>

        <p class="footer-note">
            Servidor ativo em <strong>http://localhost:3000</strong>.
        </p>
    </div>
</body>
</html>
